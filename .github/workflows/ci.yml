name: CI

on:
  push:
  pull_request:

jobs:
  build-and-test:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - name: Swift version
        run: swift --version
      - name: Test core
        run: swift test
      - name: Build app bundle
        run: scripts/build-app.sh
      - name: Zip app
        run: cd build && ditto -c -k --keepParent "RT Trainer.app" RT-Trainer.zip
      - uses: actions/upload-artifact@v4
        with:
          name: RT-Trainer-app
          path: build/RT-Trainer.zip
