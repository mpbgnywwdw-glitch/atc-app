name: CI

on:
  push:
  pull_request:

jobs:
  build-and-test:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - name: Swift version
        run: swift --version
      - name: Test core
        run: swift test
      - name: Build app bundle
        run: scripts/build-app.sh
      - name: Check app icon
        run: test -s "build/RT Trainer.app/Contents/Resources/AppIcon.icns" && file "build/RT Trainer.app/Contents/Resources/AppIcon.icns"
      - name: Zip app
        run: cd build && ditto -c -k --keepParent "RT Trainer.app" RT-Trainer.zip
      - uses: actions/upload-artifact@v4
        with:
          name: RT-Trainer-app
          path: build/RT-Trainer.zip
      - name: Build Xcode project
        run: |
          xcodebuild -project App/RTTrainer.xcodeproj -scheme "RT Trainer" -configuration Release \
            -destination 'platform=macOS' -derivedDataPath build/xcode CODE_SIGNING_ALLOWED=NO build
          APP="build/xcode/Build/Products/Release/RT Trainer.app"
          test -f "$APP/Contents/Resources/scenario-packs/index.json"
          test -f "$APP/Contents/Resources/PrivacyInfo.xcprivacy"
          test -s "$APP/Contents/Resources/AppIcon.icns"
          /usr/libexec/PlistBuddy -c "Print :NSMicrophoneUsageDescription" "$APP/Contents/Info.plist"
          /usr/libexec/PlistBuddy -c "Print :ITSAppUsesNonExemptEncryption" "$APP/Contents/Info.plist"
      - name: UI smoke test
        run: scripts/ui-smoke.sh controlled-departure
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ui-smoke
          path: build/smoke
